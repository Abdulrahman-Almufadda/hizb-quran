# Local full stack:  docker compose up --build   ->  http://localhost:8081
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hizb}
      POSTGRES_USER: ${POSTGRES_USER:-hizb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hizb_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + seed run only when pgdata is empty. To re-seed: docker compose down -v
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # handy for DBeaver/psql locally; remove on a real server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-hizb};Username=${POSTGRES_USER:-hizb};Password=${POSTGRES_PASSWORD:-hizb_dev_password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # direct API access (http://localhost:8080/health, /api/surahs)

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
