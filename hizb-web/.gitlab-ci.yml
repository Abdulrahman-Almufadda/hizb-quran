# GitLab equivalent of .github/workflows/ci.yml (keep whichever platform you pick).
stages: [test, build]

backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd backend
    - dotnet restore
    - dotnet build --no-restore -c Release
    - dotnet test --no-build -c Release

frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm install
    - npm run build

docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t hizb-api ./backend
    - docker build -t hizb-web ./frontend
