server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the backend container (service name from docker-compose.yml).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    access_log off;
    return 200 "ok\n";
  }

  # Angular router: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
